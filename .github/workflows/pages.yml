name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public website
        run: |
          mkdir _site
          cp index.html styles.css app.js .nojekyll _site/
          # Stamp "Last updated" with the date of the commit being deployed (Pacific time).
          iso="$(TZ=America/Los_Angeles git log -1 --date=format-local:%Y-%m-%d --format=%cd)"
          human="$(TZ=America/Los_Angeles git log -1 --date='format-local:%B %-d, %Y' --format=%cd)"
          sed -i -E "s|<time id=\"last-updated\" datetime=\"[^\"]*\">[^<]*</time>|<time id=\"last-updated\" datetime=\"$iso\">$human</time>|" _site/index.html
          grep -q "datetime=\"$iso\">$human</time>" _site/index.html
          cp -R assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
